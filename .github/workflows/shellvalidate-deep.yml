name: Shell validator deep tests

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: deterministic-deep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Replay deterministic models twice
        run: go test ./shellvalidate -run 'Test(BoundedRecursiveModel|DeterministicPairwiseModel|DeterministicPropertyCorpus|RecoveryMutationModel|MutationKillAudit)$' -count=2

      - name: Test without cgo
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  race:
    name: race-hardening
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race suite
        run: go test -race ./shellvalidate
