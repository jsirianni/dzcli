version: 2

project_name: dzcli

builds:
  - id: dzcli
    main: ./cmd/dzcli
    binary: dzcli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X dzcli/cli.version={{ .Version }}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: dzcli
    ids:
      - dzcli
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  prerelease: auto
